name: Release
# On every push to main that touches the app, builds a Developer ID signed, notarized DMG with
# Scripts/release.sh and publishes it as a GitHub Release in kohey18/editan-releases.
# Version: the latest published release with the patch number bumped, or MARKETING_VERSION in
# project.yml when that is higher (edit it for a minor/major release). Build number: the
# number of commits on main. Setup (secrets, environment): docs/distribution.md
on:
  push:
    branches: [main]
    paths:
      - Editan/**
      - project.yml
      - Scripts/release.sh
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.1). Leave empty to compute it automatically.
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      RELEASES_REPO: kohey18/editan-releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build tools
        run: brew install xcodegen
      - name: Run security regression tests
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Editan.xcodeproj -scheme EditanSecurityTests -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData test
      - name: Decide version and build number
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view -R "$RELEASES_REPO" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          LATEST=${LATEST#v}
          BASE=$(awk -F'"' '/MARKETING_VERSION:/{print $2; exit}' project.yml)
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION=$INPUT_VERSION
          elif [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -n 1)" != "$LATEST" ]; then
            VERSION=$BASE
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          if gh release view "v$VERSION" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists in $RELEASES_REPO"; exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "Latest release: $LATEST, project.yml: $BASE -> releasing $VERSION ($BUILD_NUMBER)"
          { echo "VERSION=$VERSION"; echo "BUILD_NUMBER=$BUILD_NUMBER"; } >> "$GITHUB_ENV"
      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend the signing keychain to the user search list so codesign and xcodebuild find it.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/developer-id.p12"
      - name: Write App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
      - name: Build, sign, and notarize
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Empty repository variables fall back to the defaults in release.sh.
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          [ -n "$DEVELOPER_ID_APPLICATION" ] || unset DEVELOPER_ID_APPLICATION
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8" ./Scripts/release.sh "$VERSION" "$BUILD_NUMBER"
          mkdir -p dist
          cp build/distribution/Editan-"$VERSION".*/Editan-"$VERSION".dmg \
            build/distribution/Editan-"$VERSION".*/Editan-"$VERSION".dmg.sha256 dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Editan-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
      - name: Publish the release in editan-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Editan $VERSION is signed with Developer ID and notarized by Apple. The DMG and app include notarization tickets.

          - macOS 14 or later; Apple Silicon and Intel in one download.
          - Open \`Editan-$VERSION.dmg\` and drag Editan to Applications.
          - Download the \`.sha256\` file to verify the DMG checksum if needed.

          Built from kohey18/editan@$GITHUB_SHA.
          EOF
          gh release create "v$VERSION" dist/* -R "$RELEASES_REPO" --latest \
            --title "Editan $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
