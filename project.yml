name: Editan
options:
  bundleIdPrefix: io.github.kohey18
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.8.0
schemes:
  Editan:
    build:
      targets:
        Editan: all
    run:
      config: Debug
  EditanSecurityTests:
    build:
      targets:
        EditanSecurityTests: [test]
    test:
      config: Debug
      targets:
        - EditanSecurityTests
targets:
  EditanSecurityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Editan/Sources/Preview/SafeHTMLFormatter.swift
      - Editan/Sources/Preview/MarkdownRenderer.swift
      - Editan/Sources/Notion/NotionCredentials.swift
      - Editan/Sources/Transforms/ClaudeCLI.swift
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
  Editan:
    type: application
    platform: macOS
    sources:
      - Editan/Sources
      - path: Editan/Resources
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    info:
      path: Editan/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kohey18.editan
        PRODUCT_NAME: Editan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
